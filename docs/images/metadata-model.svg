<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="620" viewBox="0 0 1210 620" font-family="'BIZ UDPGothic', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif">
  <defs>
    <style>
      .name { font-size: 17px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
      .sub { font-size: 14px; fill: #6b7280; text-anchor: middle; }
      .chip { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; }
      .chiptext { font-size: 14px; font-weight: bold; fill: #92400e; text-anchor: middle; }
      .entry { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
      .type { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .ref { stroke: #059669; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
      .reflabel { font-size: 14px; fill: #047857; text-anchor: middle; }
      .legend { font-size: 15px; fill: #374151; }
    </style>
  </defs>
  <rect width="1210" height="620" fill="#ffffff"/>

  <rect x="20" y="20" width="690" height="490" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="40" y="50" font-size="15" fill="#6b7280">プロジェクトとロケーション</text>

  <rect x="40" y="66" width="650" height="424" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="62" y="98" font-size="20" font-weight="bold" fill="#1f2937">Entry Group</text>
  <text x="62" y="122" font-size="14" fill="#6b7280">例: @bigquery</text>

  <rect class="entry" x="60" y="150" width="250" height="200" rx="10"/>
  <text class="name" x="185" y="182">Entry</text>
  <text class="sub" x="185" y="204">例: customer_orders テーブル</text>
  <rect class="chip" x="75" y="222" width="220" height="38" rx="8"/>
  <text class="chiptext" x="185" y="246">Aspect　例: 列の一覧</text>
  <rect class="chip" x="75" y="272" width="220" height="38" rx="8"/>
  <text class="chiptext" x="185" y="296">Aspect　例: 列の分類</text>

  <rect class="entry" x="420" y="150" width="250" height="200" rx="10"/>
  <text class="name" x="545" y="182">Entry</text>
  <text class="sub" x="545" y="204">例: customers テーブル</text>
  <rect class="chip" x="435" y="222" width="220" height="38" rx="8"/>
  <text class="chiptext" x="545" y="246">Aspect　例: 列の一覧</text>
  <rect class="chip" x="435" y="272" width="220" height="38" rx="8"/>
  <text class="chiptext" x="545" y="296">Aspect　例: 所有者</text>

  <line x1="310" y1="330" x2="420" y2="330" stroke="#2563eb" stroke-width="3"/>
  <rect x="313" y="313" width="104" height="34" rx="17" fill="#2563eb"/>
  <text x="365" y="336" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Entry Link</text>
  <text x="352" y="376" font-size="14" fill="#6b7280" text-anchor="end">例: 結合できるという関係</text>

  <text x="1015" y="122" font-size="15" fill="#6b7280" text-anchor="middle">型の定義</text>
  <rect class="type" x="850" y="150" width="330" height="64" rx="10"/>
  <text class="name" x="1015" y="178">Entry Type</text>
  <text class="sub" x="1015" y="200">例: BigQuery テーブル用の型</text>
  <rect class="type" x="850" y="300" width="330" height="64" rx="10"/>
  <text class="name" x="1015" y="328">Aspect Type</text>
  <text class="sub" x="1015" y="350">例: Schema</text>
  <rect class="type" x="850" y="430" width="330" height="64" rx="10"/>
  <text class="name" x="1015" y="458">Entry Link Type</text>
  <text class="sub" x="1015" y="480">例: schema-join</text>

  <path class="ref" d="M670,170 H838"/>
  <polygon points="836,163 836,177 849,170" fill="#059669"/>
  <text class="reflabel" x="770" y="160">型として参照</text>

  <path class="ref" d="M655,291 H750 V332 H838"/>
  <polygon points="836,325 836,339 849,332" fill="#059669"/>
  <text class="reflabel" x="803" y="322">インスタンス</text>

  <path class="ref" d="M365,347 V462 H838"/>
  <polygon points="836,455 836,469 849,462" fill="#059669"/>
  <text class="reflabel" x="770" y="452">インスタンス</text>

  <path class="ref" d="M1015,214 V288"/>
  <polygon points="1008,286 1022,286 1015,299" fill="#059669"/>
  <text x="1028" y="262" font-size="14" fill="#047857">必須の型を指定</text>

  <rect x="40" y="546" width="34" height="24" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="48" y="553" width="18" height="10" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text class="legend" x="84" y="564">包含（箱の入れ子）</text>
  <line x1="290" y1="558" x2="340" y2="558" class="ref"/>
  <polygon points="338,551 338,565 351,558" fill="#059669"/>
  <text class="legend" x="362" y="564">参照</text>
  <line x1="450" y1="558" x2="500" y2="558" stroke="#2563eb" stroke-width="3"/>
  <text class="legend" x="512" y="564">Entry Link（Entry や列どうしの関係）</text>
</svg>
