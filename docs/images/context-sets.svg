<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'BIZ UDPGothic', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif">
  <defs><style>
    .box { fill: #ffffff; stroke: #ec4899; stroke-width: 1.5; }
    .name { font-size: 15px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
    .sub { font-size: 13px; fill: #6b7280; text-anchor: middle; }
    .tree { stroke: #9ca3af; stroke-width: 2; fill: none; }
  </style></defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <rect x="20" y="20" width="800" height="480" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="42" y="52" font-size="17" font-weight="bold" fill="#9d174d">Context Set　例: 販売分析用</text>
  <text x="42" y="76" font-size="13" fill="#6b7280">特殊な Entry Group。中身は Entry と Aspect</text>

  <rect class="box" x="50" y="232" width="190" height="60" rx="8"/><text class="name" x="145" y="258">ルートインデックス</text><text class="sub" x="145" y="279">agents</text>
  <rect class="box" x="300" y="112" width="180" height="60" rx="8"/><text class="name" x="390" y="138">ディレクトリ</text><text class="sub" x="390" y="159">assets</text>
  <rect class="box" x="300" y="322" width="180" height="60" rx="8"/><text class="name" x="390" y="348">ディレクトリ</text><text class="sub" x="390" y="369">documents</text>

  <rect class="box" x="540" y="112" width="250" height="60" rx="8"/><text class="name" x="665" y="138">データ資産</text><text class="sub" x="665" y="159">assets/bigquery/...</text>
  <rect class="box" x="540" y="250" width="250" height="60" rx="8"/><text class="name" x="665" y="276">業務概念</text><text class="sub" x="665" y="297">documents/concepts/*</text>
  <rect class="box" x="540" y="322" width="250" height="60" rx="8"/><text class="name" x="665" y="348">ナレッジベース</text><text class="sub" x="665" y="369">documents/*</text>
  <rect class="box" x="540" y="394" width="250" height="60" rx="8"/><text class="name" x="665" y="420">ラーニング</text><text class="sub" x="665" y="441">documents/learnings/*</text>
  <rect class="box" x="50" y="394" width="190" height="60" rx="8"/><text class="name" x="145" y="420">クエリテンプレート</text><text class="sub" x="145" y="441">パラメータ付きの SQL</text>

  <path class="tree" d="M240,262 H270 V142 H300"/><path class="tree" d="M270,262 V352 H300"/>
  <path class="tree" d="M480,142 H540"/>
  <path class="tree" d="M480,352 H540"/><path class="tree" d="M510,352 V280 H540"/><path class="tree" d="M510,352 V424 H540"/>

  <rect x="900" y="72" width="280" height="140" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="920" y="102" font-size="15" font-weight="bold" fill="#1d4ed8">Entry Group　@bigquery</text>
  <rect x="920" y="118" width="240" height="60" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text class="name" x="1040" y="144">実テーブルの Entry</text><text class="sub" x="1040" y="165">customer_orders</text>
  <line x1="790" y1="142" x2="904" y2="142" stroke="#4b5563" stroke-width="2.5"/><polygon points="902,134 902,150 918,142" fill="#4b5563"/>
  <text x="845" y="128" font-size="15" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Reference</text>
  <text x="1040" y="250" font-size="13" fill="#6b7280" text-anchor="middle">Context Set はデータへの</text>
  <text x="1040" y="270" font-size="13" fill="#6b7280" text-anchor="middle">アクセス権を付与しない</text>
</svg>
