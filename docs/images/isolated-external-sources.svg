<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="'BIZ UDPGothic', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
      .name { font-size: 14px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
      .sub { font-size: 12.5px; fill: #6b7280; text-anchor: middle; }
      .row { font-size: 15px; font-weight: bold; fill: #1f2937; }
      .in { stroke: #dc2626; stroke-width: 2.5; fill: none; }
      .out { stroke: #059669; stroke-width: 2.5; fill: none; }
      .flow { stroke: #6b7280; stroke-width: 2; fill: none; }
      .inl { font-size: 13px; fill: #b91c1c; text-anchor: middle; }
      .outl { font-size: 13px; fill: #047857; text-anchor: middle; }
      .legend { font-size: 14px; fill: #374151; }
    </style>
  </defs>
  <rect width="1240" height="560" fill="#ffffff"/>

  <rect x="20" y="20" width="395" height="470" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="40" y="48" font-size="16" font-weight="bold" fill="#9a3412">Google Cloud の外</text>
  <rect x="435" y="20" width="785" height="470" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="455" y="48" font-size="16" font-weight="bold" fill="#1d4ed8">Google Cloud</text>

  <rect x="1060" y="84" width="140" height="386" rx="10" fill="#2563eb"/>
  <text x="1130" y="272" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Knowledge</text>
  <text x="1130" y="296" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Catalog</text>

  <!-- 1 管理型コネクタ -->
  <text class="row" x="40" y="78">① 管理型コネクタ</text>
  <rect class="box" x="40" y="88" width="170" height="56" rx="8"/>
  <text class="name" x="125" y="112">データソース</text>
  <text class="sub" x="125" y="131">Oracle、Snowflake など</text>
  <rect class="box" x="460" y="88" width="570" height="56" rx="8"/>
  <text class="name" x="745" y="112">BigQuery Data Transfer Service</text>
  <text class="sub" x="745" y="131">転送を管理する</text>
  <line class="in" x1="460" y1="116" x2="224" y2="116"/>
  <polygon points="226,109 226,123 212,116" fill="#dc2626"/>
  <text class="inl" x="336" y="106">公開 IP かプライベート接続</text>
  <line class="flow" x1="1030" y1="116" x2="1048" y2="116"/>
  <polygon points="1046,110 1046,122 1058,116" fill="#6b7280"/>

  <!-- 2 パイプライン -->
  <text class="row" x="40" y="182">② Managed connectivity パイプライン</text>
  <rect class="box" x="40" y="192" width="170" height="56" rx="8"/>
  <text class="name" x="125" y="216">データソース</text>
  <text class="sub" x="125" y="235">接続できるもの全般</text>
  <rect class="box" x="460" y="192" width="220" height="56" rx="8"/>
  <text class="name" x="570" y="216">コネクタ</text>
  <text class="sub" x="570" y="235">自分の VPC 内の Spark バッチ</text>
  <rect class="box" x="700" y="192" width="140" height="56" rx="8"/>
  <text class="name" x="770" y="216">Cloud Storage</text>
  <text class="sub" x="770" y="235">インポートファイル</text>
  <rect class="box" x="860" y="192" width="170" height="56" rx="8"/>
  <text class="name" x="945" y="225">インポートジョブ</text>
  <line class="in" x1="460" y1="220" x2="224" y2="220"/>
  <polygon points="226,213 226,227 212,220" fill="#dc2626"/>
  <text class="inl" x="336" y="210">VPC からの経路が必要</text>
  <line class="flow" x1="680" y1="220" x2="690" y2="220"/><polygon points="688,214 688,226 699,220" fill="#6b7280"/>
  <line class="flow" x1="840" y1="220" x2="850" y2="220"/><polygon points="848,214 848,226 859,220" fill="#6b7280"/>
  <line class="flow" x1="1030" y1="220" x2="1048" y2="220"/><polygon points="1046,214 1046,226 1058,220" fill="#6b7280"/>

  <!-- 3 自前の抽出 -->
  <text class="row" x="40" y="286">③ 自前の抽出とインポート</text>
  <rect class="box" x="40" y="296" width="170" height="56" rx="8"/>
  <text class="name" x="125" y="320">データソース</text>
  <text class="sub" x="125" y="339">Salesforce、SAP など</text>
  <rect class="box" x="230" y="296" width="170" height="56" rx="8"/>
  <text class="name" x="315" y="320">抽出処理</text>
  <text class="sub" x="315" y="339">データソースの側で動かす</text>
  <rect class="box" x="700" y="296" width="140" height="56" rx="8"/>
  <text class="name" x="770" y="320">Cloud Storage</text>
  <text class="sub" x="770" y="339">インポートファイル</text>
  <rect class="box" x="860" y="296" width="170" height="56" rx="8"/>
  <text class="name" x="945" y="329">インポートジョブ</text>
  <line class="flow" x1="230" y1="324" x2="222" y2="324"/><polygon points="223,318 223,330 212,324" fill="#6b7280"/>
  <line class="out" x1="400" y1="324" x2="686" y2="324"/>
  <polygon points="684,317 684,331 698,324" fill="#059669"/>
  <text class="outl" x="550" y="314">外向きにファイルを送るだけ</text>
  <line class="flow" x1="840" y1="324" x2="850" y2="324"/><polygon points="848,318 848,330 859,324" fill="#6b7280"/>
  <line class="flow" x1="1030" y1="324" x2="1048" y2="324"/><polygon points="1046,318 1046,330 1058,324" fill="#6b7280"/>

  <!-- 4 カタログ連携 -->
  <text class="row" x="40" y="390">④ 外部カタログとの連携</text>
  <rect class="box" x="40" y="400" width="170" height="56" rx="8"/>
  <text class="name" x="125" y="424">外部カタログ</text>
  <text class="sub" x="125" y="443">Unity、Glue、SAP BDC</text>
  <rect class="box" x="460" y="400" width="570" height="56" rx="8"/>
  <text class="name" x="745" y="424">Lakehouse runtime catalog</text>
  <text class="sub" x="745" y="443">外部カタログのエンドポイントに接続する</text>
  <line class="in" x1="460" y1="428" x2="224" y2="428"/>
  <polygon points="226,421 226,435 212,428" fill="#dc2626"/>
  <text class="inl" x="336" y="418">インターネットか専用線</text>
  <line class="flow" x1="1030" y1="428" x2="1048" y2="428"/>
  <polygon points="1046,422 1046,434 1058,428" fill="#6b7280"/>

  <!-- 凡例 -->
  <line class="in" x1="40" y1="524" x2="90" y2="524"/><polygon points="42,517 42,531 28,524" fill="#dc2626"/>
  <text class="legend" x="102" y="529">Google Cloud からデータソースへ接続する</text>
  <line class="out" x1="470" y1="524" x2="520" y2="524"/><polygon points="518,517 518,531 532,524" fill="#059669"/>
  <text class="legend" x="544" y="529">データソース側から Google Cloud へ送る</text>
</svg>
