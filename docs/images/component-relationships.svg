<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="640" viewBox="0 0 1210 640" font-family="'BIZ UDPGothic', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif">
  <defs>
    <style>
      .name { font-size: 17px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
      .sub { fill: #6b7280; text-anchor: middle; }
      .chip { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; }
      .chiptext { font-size: 15px; font-weight: bold; fill: #92400e; text-anchor: middle; }
      .entry { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
      .type { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
      .ref { stroke: #059669; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
      .reflabel { font-size: 14px; fill: #047857; text-anchor: middle; }
      .legend { font-size: 15px; fill: #374151; }
    </style>
  </defs>
  <rect width="1210" height="640" fill="#ffffff"/>

  <!-- プロジェクトとロケーション -->
  <rect x="20" y="20" width="690" height="510" rx="14" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="40" y="50" font-size="15" fill="#6b7280">プロジェクトとロケーション</text>

  <!-- Entry Group -->
  <rect x="40" y="66" width="650" height="444" rx="12" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="62" y="98" font-size="20" font-weight="bold" fill="#1f2937">Entry Group</text>
  <text x="62" y="122" font-size="14" fill="#6b7280">リージョン単位のコンテナ。管理とセキュリティの境界</text>

  <!-- Entry A -->
  <rect class="entry" x="70" y="150" width="230" height="200" rx="10"/>
  <text class="name" x="185" y="182">Entry</text>
  <text class="sub" font-size="14" x="185" y="204">データ資産 1 つ</text>
  <rect class="chip" x="90" y="222" width="190" height="38" rx="8"/>
  <text class="chiptext" x="185" y="246">Aspect</text>
  <rect class="chip" x="90" y="272" width="190" height="38" rx="8"/>
  <text class="chiptext" x="185" y="296">Aspect（列に付与）</text>

  <!-- Entry B -->
  <rect class="entry" x="420" y="150" width="230" height="200" rx="10"/>
  <text class="name" x="535" y="182">Entry</text>
  <text class="sub" font-size="14" x="535" y="204">データ資産 1 つ</text>
  <rect class="chip" x="440" y="222" width="190" height="38" rx="8"/>
  <text class="chiptext" x="535" y="246">Aspect</text>
  <rect class="chip" x="440" y="272" width="190" height="38" rx="8"/>
  <text class="chiptext" x="535" y="296">Aspect</text>

  <!-- Entry Link -->
  <line x1="300" y1="330" x2="420" y2="330" stroke="#2563eb" stroke-width="3"/>
  <rect x="308" y="313" width="104" height="34" rx="17" fill="#2563eb"/>
  <text x="360" y="336" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Entry Link</text>
  <line x1="360" y1="347" x2="360" y2="382" stroke="#f59e0b" stroke-width="1.5"/>
  <rect class="chip" x="305" y="382" width="110" height="36" rx="8"/>
  <text class="chiptext" x="360" y="405">Aspect</text>

  <!-- 型 -->
  <text x="1015" y="122" font-size="15" fill="#6b7280" text-anchor="middle">型の定義</text>
  <rect class="type" x="850" y="150" width="330" height="64" rx="10"/>
  <text class="name" x="1015" y="178">Entry Type</text>
  <text class="sub" font-size="14" x="1015" y="200">Entry の構造と必須の Aspect</text>
  <rect class="type" x="850" y="300" width="330" height="64" rx="10"/>
  <text class="name" x="1015" y="328">Aspect Type</text>
  <text class="sub" font-size="14" x="1015" y="350">フィールド、データ型、検証ルール</text>
  <rect class="type" x="850" y="450" width="330" height="64" rx="10"/>
  <text class="name" x="1015" y="478">Entry Link Type</text>
  <text class="sub" font-size="12.5" x="1015" y="500">definition / synonym / related / schema-join</text>

  <!-- 参照 -->
  <path class="ref" d="M650,170 H838"/>
  <polygon points="836,163 836,177 849,170" fill="#059669"/>
  <text class="reflabel" x="770" y="160">型として参照</text>

  <path class="ref" d="M630,291 H740 V332 H838"/>
  <polygon points="836,325 836,339 849,332" fill="#059669"/>
  <text class="reflabel" x="795" y="322">インスタンス</text>

  <path class="ref" d="M360,418 V482 H838"/>
  <polygon points="836,475 836,489 849,482" fill="#059669"/>
  <text class="reflabel" x="770" y="472">インスタンス</text>

  <path class="ref" d="M1015,214 V288"/>
  <polygon points="1008,286 1022,286 1015,299" fill="#059669"/>
  <text x="1028" y="262" font-size="14" fill="#047857">必須の型を指定</text>

  <!-- 凡例 -->
  <rect x="40" y="566" width="34" height="24" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="48" y="573" width="18" height="10" rx="3" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <text class="legend" x="84" y="584">包含（箱の入れ子）</text>
  <line x1="290" y1="578" x2="340" y2="578" class="ref"/>
  <polygon points="338,571 338,585 351,578" fill="#059669"/>
  <text class="legend" x="362" y="584">参照</text>
  <line x1="450" y1="578" x2="500" y2="578" stroke="#2563eb" stroke-width="3"/>
  <text class="legend" x="512" y="584">Entry Link（Entry や列どうしの関係）</text>
</svg>
