<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'BIZ UDPGothic', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif">
  <defs>
    <style>
      .kind { font-size: 13px; fill: #6b7280; text-anchor: middle; }
      .name { font-size: 17px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
      .edge { stroke: #4b5563; stroke-width: 2.5; fill: none; }
      .elabel { font-size: 16px; font-weight: bold; fill: #1d4ed8; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>

  <!-- 用語 -->
  <rect x="430" y="36" width="300" height="78" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="kind" x="580" y="64">ビジネス用語集の用語</text>
  <text class="name" x="580" y="92">顧客メールアドレス</text>

  <!-- テーブル（中心） -->
  <rect x="430" y="246" width="300" height="88" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text class="kind" x="580" y="276">テーブル</text>
  <text class="name" x="580" y="304">customer_orders</text>
  <text class="kind" x="580" y="324">email_address 列など</text>

  <!-- 結合先のテーブル -->
  <rect x="900" y="250" width="270" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="kind" x="1035" y="282">テーブル</text>
  <text class="name" x="1035" y="310">customers</text>

  <!-- データプロダクト -->
  <rect x="30" y="250" width="270" height="80" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text class="kind" x="165" y="282">データプロダクト</text>
  <text class="name" x="165" y="310">販売データ</text>

  <!-- Context Set -->
  <rect x="330" y="452" width="520" height="140" rx="12" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
  <text x="352" y="482" font-size="13" fill="#6b7280">Context Set</text>
  <text x="352" y="508" font-size="17" font-weight="bold" fill="#1f2937">販売分析用</text>
  <rect x="560" y="494" width="270" height="78" rx="10" fill="#ffffff" stroke="#ec4899" stroke-width="1.5"/>
  <text class="kind" x="695" y="522">データ資産の Entry</text>
  <text class="name" x="695" y="550">customer_orders の説明</text>

  <!-- Definition -->
  <line class="edge" x1="580" y1="246" x2="580" y2="128"/>
  <polygon points="572,130 588,130 580,115" fill="#4b5563"/>
  <text class="elabel" x="596" y="186">Definition</text>

  <!-- Schema join -->
  <line class="edge" x1="730" y1="290" x2="900" y2="290"/>
  <text class="elabel" x="815" y="278" text-anchor="middle">Schema join</text>

  <!-- Packages -->
  <line class="edge" x1="430" y1="290" x2="314" y2="290"/>
  <polygon points="316,282 316,298 301,290" fill="#4b5563"/>
  <text class="elabel" x="366" y="278" text-anchor="middle">Packages</text>

  <!-- Context -->
  <line class="edge" x1="470" y1="452" x2="470" y2="348"/>
  <polygon points="462,350 478,350 470,335" fill="#4b5563"/>
  <text class="elabel" x="456" y="400" text-anchor="end">Context</text>

  <!-- Reference -->
  <line class="edge" x1="695" y1="494" x2="695" y2="348"/>
  <polygon points="687,350 703,350 695,335" fill="#4b5563"/>
  <text class="elabel" x="711" y="400">Reference</text>
</svg>
