<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="'BIZ UDPGothic', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif">
  <defs><style>
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .name { font-size: 15px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
    .sub { font-size: 13px; fill: #6b7280; text-anchor: middle; }
    .zone { font-size: 16px; font-weight: bold; }
    .flow { stroke: #6b7280; stroke-width: 2.5; fill: none; }
  </style></defs>
  <rect width="1200" height="380" fill="#ffffff"/>
  <rect x="20" y="20" width="310" height="340" rx="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text class="zone" x="40" y="50" fill="#374151">入力になる情報</text>
  <rect class="box" x="40" y="68" width="270" height="44" rx="8"/><text class="name" x="175" y="95">BigQuery のテーブルとビュー</text>
  <rect class="box" x="40" y="124" width="270" height="44" rx="8"/><text class="name" x="175" y="151">Cloud Storage 上の文書</text>
  <rect class="box" x="40" y="180" width="270" height="44" rx="8"/><text class="name" x="175" y="207">外部ナレッジ（Confluence など）</text>
  <rect class="box" x="40" y="236" width="270" height="44" rx="8"/><text class="name" x="175" y="263">クエリ履歴</text>
  <rect class="box" x="40" y="292" width="270" height="44" rx="8"/><text class="name" x="175" y="319">チャットログ</text>

  <rect x="430" y="20" width="360" height="340" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text class="zone" x="610" y="52" fill="#1d4ed8" text-anchor="middle">Knowledge Studio</text>
  <rect class="box" x="455" y="72" width="310" height="76" rx="8"/><text class="name" x="610" y="103">New chat</text><text class="sub" x="610" y="127">自然言語での探索、Context Graph の表示</text>
  <rect class="box" x="455" y="164" width="310" height="76" rx="8"/><text class="name" x="610" y="195">Context sets</text><text class="sub" x="610" y="219">Context Set の作成と管理</text>
  <rect class="box" x="455" y="256" width="310" height="76" rx="8"/><text class="name" x="610" y="287">Enrichments</text><text class="sub" x="610" y="311">AI による提案の生成とレビュー</text>

  <rect x="890" y="20" width="290" height="340" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text class="zone" x="910" y="50" fill="#047857">コンテキストを使う AI</text>
  <rect class="box" x="910" y="100" width="250" height="52" rx="8"/><text class="name" x="1035" y="131">Gemini Enterprise</text>
  <rect class="box" x="910" y="172" width="250" height="52" rx="8"/><text class="name" x="1035" y="203">Conversational Analytics</text>
  <rect class="box" x="910" y="244" width="250" height="52" rx="8"/><text class="name" x="1035" y="275">カスタムエージェント</text>

  <line class="flow" x1="330" y1="190" x2="414" y2="190"/><polygon points="412,182 412,198 428,190" fill="#6b7280"/>
  <line class="flow" x1="790" y1="190" x2="874" y2="190"/><polygon points="872,182 872,198 888,190" fill="#6b7280"/>
  <text x="840" y="176" font-size="14" fill="#4b5563" text-anchor="middle">MCP / API</text>
</svg>
