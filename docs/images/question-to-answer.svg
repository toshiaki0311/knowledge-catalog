<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="'BIZ UDPGothic', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif">
  <defs><style>
    .head { font-size: 16px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
    .life { stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .msg { stroke: #374151; stroke-width: 2.5; fill: none; }
    .ret { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
    .label { font-size: 14px; fill: #1f2937; text-anchor: middle; }
  </style></defs>
  <rect width="1200" height="500" fill="#ffffff"/>
  <line class="life" x1="160" y1="72" x2="160" y2="480"/><line class="life" x1="460" y1="72" x2="460" y2="480"/><line class="life" x1="760" y1="72" x2="760" y2="480"/><line class="life" x1="1040" y1="72" x2="1040" y2="480"/>
  <rect x="60" y="20" width="200" height="52" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text class="head" x="160" y="52">ユーザー</text>
  <rect x="360" y="20" width="200" height="52" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text class="head" x="460" y="52">AI エージェント</text>
  <rect x="660" y="20" width="200" height="52" rx="10" fill="#2563eb"/><text class="head" x="760" y="52" style="fill:#ffffff">Knowledge Catalog</text>
  <rect x="940" y="20" width="200" height="52" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text class="head" x="1040" y="52">データウェアハウス</text>

  <text class="label" x="310" y="112">① 「先月の売上は」と尋ねる</text>
  <line class="msg" x1="160" y1="122" x2="444" y2="122"/><polygon points="442,114 442,130 458,122" fill="#374151"/>

  <text class="label" x="610" y="172">② コンテキストを要求する</text>
  <line class="msg" x1="460" y1="182" x2="744" y2="182"/><polygon points="742,174 742,190 758,182" fill="#374151"/>

  <text class="label" x="610" y="232">③ 用語の定義、テーブル、結合条件</text>
  <line class="ret" x1="760" y1="242" x2="476" y2="242"/><polygon points="478,234 478,250 462,242" fill="#6b7280"/>

  <rect x="340" y="272" width="240" height="46" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text class="label" x="460" y="300">④ プロンプトに注入し SQL を生成</text>

  <rect x="820" y="338" width="160" height="24" fill="#ffffff"/>
  <text class="label" x="900" y="356">⑤ SQL を実行する</text>
  <line class="msg" x1="460" y1="366" x2="1024" y2="366"/><polygon points="1022,358 1022,374 1038,366" fill="#374151"/>

  <text class="label" x="900" y="406">結果</text>
  <line class="ret" x1="1040" y1="416" x2="476" y2="416"/><polygon points="478,408 478,424 462,416" fill="#6b7280"/>

  <text class="label" x="310" y="452">⑥ 回答する</text>
  <line class="ret" x1="460" y1="462" x2="176" y2="462"/><polygon points="178,454 178,470 162,462" fill="#6b7280"/>
</svg>
