<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="'BIZ UDPGothic', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
      .name { font-size: 16px; font-weight: bold; fill: #1f2937; text-anchor: middle; }
      .sub { font-size: 13px; fill: #6b7280; text-anchor: middle; }
      .ok { stroke: #059669; stroke-width: 2.5; fill: none; }
      .ng { stroke: #dc2626; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; }
      .ctx { stroke: #6b7280; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="500" fill="#ffffff"/>

  <!-- Google Cloud -->
  <rect x="20" y="60" width="310" height="320" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="40" y="90" font-size="16" font-weight="bold" fill="#1d4ed8">Google Cloud</text>
  <rect x="50" y="180" width="250" height="80" rx="10" fill="#2563eb"/>
  <text x="175" y="216" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Knowledge Catalog</text>
  <text x="175" y="240" font-size="13" fill="#dbeafe" text-anchor="middle">メタデータを管理する</text>

  <!-- 分離 -->
  <line class="ng" x1="300" y1="220" x2="366" y2="220"/>
  <rect x="374" y="84" width="12" height="272" rx="4" fill="#dc2626"/>
  <line x1="341" y1="208" x2="365" y2="232" stroke="#dc2626" stroke-width="4"/>
  <line x1="365" y1="208" x2="341" y2="232" stroke="#dc2626" stroke-width="4"/>
  <text x="380" y="404" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">ネットワークやセキュリティ上の分離</text>

  <!-- Google Cloud の外 -->
  <rect x="430" y="20" width="360" height="360" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="450" y="50" font-size="16" font-weight="bold" fill="#9a3412">Google Cloud の外にあるデータソース</text>
  <rect class="box" x="460" y="70" width="300" height="72" rx="8"/>
  <text class="name" x="610" y="101">別クラウド</text>
  <text class="sub" x="610" y="124">Snowflake、Databricks など</text>
  <rect class="box" x="460" y="174" width="300" height="72" rx="8"/>
  <text class="name" x="610" y="205">SaaS</text>
  <text class="sub" x="610" y="228">Salesforce、SAP など</text>
  <rect class="box" x="460" y="278" width="300" height="72" rx="8"/>
  <text class="name" x="610" y="309">顧客オンプレミス</text>
  <text class="sub" x="610" y="332">ストレージ、データベース</text>

  <!-- AI エージェント -->
  <rect x="890" y="180" width="270" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text class="name" x="1025" y="216">AI エージェント</text>
  <text class="sub" x="1025" y="240">データソースへの経路と認証を持つ</text>
  <text x="1025" y="164" font-size="14" font-weight="bold" fill="#047857" text-anchor="middle">直接アクセスできる</text>

  <path class="ok" d="M890,220 H830 V106 H774"/>
  <polygon points="776,99 776,113 762,106" fill="#059669"/>
  <path class="ok" d="M890,220 H830 V210 H774"/>
  <polygon points="776,203 776,217 762,210" fill="#059669"/>
  <path class="ok" d="M890,220 H830 V314 H774"/>
  <polygon points="776,307 776,321 762,314" fill="#059669"/>

  <!-- コンテキストの取得 -->
  <path class="ctx" d="M1025,260 V450 H175 V274"/>
  <polygon points="168,276 182,276 175,262" fill="#6b7280"/>
  <text x="600" y="440" font-size="14" fill="#4b5563" text-anchor="middle">コンテキストを取得する</text>
</svg>
